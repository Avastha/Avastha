<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#050810" />
  <meta name="description" content="Avastha — all our links: music, socials, press kit and brand materials." />
  <title>AVASTHA | Links</title>
  <link rel="icon" href="/avastha_logo_transparent.ico" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=Raleway:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: dark;
      --gold: #c9a84c;
      --teal: #3dd6c8;
      --dark: #050810;
      --dark2: #0a0f1e;
      --card: #10162a;
      --text: #e8e8f0;
      --text-dim: #8899b8;
      --line: rgba(255,255,255,0.08);
      --glow-teal: 0 0 18px rgba(61,214,200,0.5), 0 0 40px rgba(61,214,200,0.22);
      --glow-gold: 0 0 18px rgba(201,168,76,0.5), 0 0 40px rgba(201,168,76,0.22);
    }
    @media (color-gamut: p3) {
      :root {
        --dark:  oklch(12% 0.022 265);
        --dark2: oklch(15% 0.026 265);
        --card:  oklch(19% 0.03 265);
        --teal:  oklch(82% 0.135 185);
        --gold:  oklch(76% 0.115 90);
        --text:  oklch(93% 0.01 265);
      }
    }
    @media (dynamic-range: high) {
      :root {
        --teal: oklch(86% 0.155 185);
        --gold: oklch(81% 0.135 90);
        --glow-teal: 0 0 20px oklch(85% 0.17 185 / 0.55), 0 0 46px oklch(85% 0.17 185 / 0.28);
        --glow-gold: 0 0 20px oklch(82% 0.15 90 / 0.55), 0 0 46px oklch(82% 0.15 90 / 0.28);
      }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Raleway', sans-serif;
      background: var(--dark);
      color: var(--text);
      min-height: 100vh;
      min-height: 100svh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 20px calc(28px + env(safe-area-inset-bottom));
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* ambient background: the Genesis photo, faded to deep dark */
    .bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      background-image:
        linear-gradient(to bottom, rgba(5,8,16,0.72) 0%, rgba(5,8,16,0.88) 42%, var(--dark) 78%),
        url('https://pub-029dbeba49ff4db5b8395ef19af790f9.r2.dev/images/Adi%20and%20Valentin%20Genesis.png');
      background-size: cover;
      background-position: center 32%;
    }

    .wrap {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: clamp(3rem, 12vh, 6rem);
    }



    /* link list */
    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 0;
    }
    .link {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 14px 18px;
      border-radius: 14px;
      background: color-mix(in srgb, var(--card) 78%, transparent);
      border: 1px solid var(--line);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: var(--text);
      text-decoration: none;
      font-size: 0.82rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease, background .25s ease;
      opacity: 0;
      animation: fadeUp 0.7s ease forwards;
    }
    .link:hover {
      transform: translateY(-3px);
      border-color: color-mix(in srgb, var(--accent, var(--teal)) 55%, transparent);
      box-shadow: var(--glow, var(--glow-teal));
      background: color-mix(in srgb, var(--card) 92%, transparent);
    }
    .link .ico {
      width: 30px; height: 30px; flex: none;
      display: flex; align-items: center; justify-content: center;
    }
    .link .ico img { width: 30px; height: 30px; object-fit: contain; border-radius: 8px; }
    .link .ico svg { width: 24px; height: 24px; fill: none; stroke: var(--accent, var(--teal)); stroke-width: 1.8; }
    .link .label { flex: 1; text-align: center; padding-right: 30px; }

    /* accent per link type */
    .link.gold { --accent: var(--gold); --glow: var(--glow-gold); }
    .link.teal { --accent: var(--teal); --glow: var(--glow-teal); }

    /* stagger */
    .link:nth-child(1){animation-delay:.50s}.link:nth-child(2){animation-delay:.56s}
    .link:nth-child(3){animation-delay:.62s}.link:nth-child(4){animation-delay:.68s}
    .link:nth-child(5){animation-delay:.74s}.link:nth-child(6){animation-delay:.80s}
    .link:nth-child(7){animation-delay:.86s}.link:nth-child(8){animation-delay:.92s}
    .link:nth-child(9){animation-delay:.98s}.link:nth-child(10){animation-delay:1.04s}


    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="bg"></div>

  <div class="wrap">
    <nav class="links">
      <a class="link gold" href="https://avastha.info" target="_blank" rel="noopener">
        <span class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 2.5 15.4 0 18M12 3c-2.5 2.6-2.5 15.4 0 18"/></svg></span>
        <span class="label">Official Website</span>
      </a>
      <a class="link teal" href="https://soundcloud.com/avastha_music" target="_blank" rel="noopener">
        <span class="ico"><img src="https://raw.githubusercontent.com/Avastha/Avastha/main/soundcloud.png" alt="" /></span>
        <span class="label">SoundCloud</span>
      </a>
      <a class="link teal" href="https://instagram.com/avastha.music" target="_blank" rel="noopener">
        <span class="ico"><img src="https://raw.githubusercontent.com/Avastha/Avastha/main/instagram.png" alt="" /></span>
        <span class="label">Instagram</span>
      </a>
      <a class="link teal" href="https://youtube.com/@Avastha_Music" target="_blank" rel="noopener">
        <span class="ico"><img src="https://raw.githubusercontent.com/Avastha/Avastha/main/youtube.png" alt="" /></span>
        <span class="label">YouTube</span>
      </a>
      <a class="link teal" href="https://facebook.com/Avastha.Music" target="_blank" rel="noopener">
        <span class="ico"><img src="https://raw.githubusercontent.com/Avastha/Avastha/main/facebook.png" alt="" /></span>
        <span class="label">Facebook</span>
      </a>
      <a class="link teal" href="https://chat.whatsapp.com/GThUsW3my9tEqU9ejBl9wa?mode=ac_c" target="_blank" rel="noopener">
        <span class="ico"><img src="https://raw.githubusercontent.com/Avastha/Avastha/main/whatsapp.png" alt="" /></span>
        <span class="label">WhatsApp</span>
      </a>
      <a class="link teal" href="/contact/">
        <span class="ico"><img src="https://raw.githubusercontent.com/Avastha/Avastha/main/gmail.png" alt="" /></span>
        <span class="label">Contact</span>
      </a>
      <a class="link gold" href="/Materials/">
        <span class="ico"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v5" stroke-linecap="round"/></svg></span>
        <span class="label">Brand Materials</span>
      </a>
      <a class="link gold" href="/Materials/#presskit">
        <span class="ico"><svg viewBox="0 0 24 24"><path d="M7 3h7l4 4v14H7z" stroke-linejoin="round"/><path d="M14 3v4h4M9 13h6M9 17h6" stroke-linecap="round"/></svg></span>
        <span class="label">Press Kit</span>
      </a>
    </nav>
  </div>
</body>
</html>
